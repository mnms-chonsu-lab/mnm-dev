name: Issue Helper

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: 브랜치명·커밋 메시지 예시 댓글 작성
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue.title || "";
            const labels = context.payload.issue.labels.map(l => l.name);

            const typeMap = { enhancement: "feat", bug: "fix", design: "docs", review: "test", task: "chore" };
            let type = "chore";
            for (const l of labels) if (typeMap[l]) { type = typeMap[l]; break; }

            const areaMatch = title.match(/\[([^\]]+\/[^\]]*|apps[^\]]*|services[^\]]*|infra|docs\/api|\.github)\]/);
            const area = areaMatch ? areaMatch[1] : "영역";

            const summaryRaw = title
              .replace(/^\[[^\]]*\]\s*/, "")
              .replace(/\[[^\]]*\]/g, "")
              .trim() || "요약";
            const summarySlug = summaryRaw.replace(/\s+/g, "_");

            const now = new Date();
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, "0");
            const dd = String(now.getDate()).padStart(2, "0");
            const date = `${yyyy}${mm}${dd}`;
            const issueNumber = context.payload.issue.number;

            const branch = `${date}_#${issueNumber}_${summarySlug}`;
            const commit = `${type}(${area}): ${summaryRaw} (#${issueNumber})`;

            const body = [
              "이 이슈로 작업할 때 참고할 브랜치명·커밋 메시지 예시입니다 (자동 생성, 브랜치는 직접 만들어주세요).",
              "",
              "```",
              `브랜치: ${branch}`,
              `커밋/PR 제목: ${commit}`,
              "```",
            ].join("\n");

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body,
            });
