# http/tls 설정이 함께 쓰는 정의 (http 컨텍스트)

upstream mnm_api {
    server api:8080;
}

# 경로 접두사 → 플랫폼 이름. API 서버에는 X-Client-Platform 헤더로, 로그에는 platform= 으로 남는다.
map $uri $client_platform {
    ~^/api/farmer/   farmer;
    ~^/api/receiver/ receiver;
    ~^/api/admin/    admin;
    ~^/api/auth/     auth;
    default          -;
}

log_format mnm '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
               'platform=$client_platform rt=$request_time rid=$request_id';
access_log /var/log/nginx/access.log mnm;
# 감시 프로그램(monitor)이 5xx 비율을 세는 파일. 20MB를 넘으면 감시 프로그램이 비운다
access_log /var/log/nginx/mnm/access.log mnm;
