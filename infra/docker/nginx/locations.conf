# 요청 구분 규칙 (http/tls 서버 블록이 함께 include)
# 경로 접두사로 농가 앱 · 접수자 웹 · 어드민 · 인증을 나눈다.
# 접두사 값은 services/api 의 ApiPaths, 스웨거 그룹과 같아야 한다.
# 나중에 플랫폼별로 서버를 나누면 upstream을 추가하고 해당 location의 proxy_pass만 바꾼다.

client_max_body_size 20m;
absolute_redirect off;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Client-Platform $client_platform;

location /api/farmer/   { proxy_pass http://mnm_api; }
location /api/receiver/ { proxy_pass http://mnm_api; }
location /api/admin/    { proxy_pass http://mnm_api; }
location /api/auth/     { proxy_pass http://mnm_api; }

# 위 네 가지가 아닌 /api 요청은 API 서버로 보내지 않는다
location /api/ { return 404; }

# 스웨거
location /swagger-ui/  { proxy_pass http://mnm_api; }
location /v3/api-docs  { proxy_pass http://mnm_api; }

# 플랫폼별 스웨거 바로가기 (primaryName = 스웨거 그룹 표시 이름을 URL 인코딩한 값)
location = /docs          { return 302 /swagger-ui/index.html; }
location = /docs/farmer   { return 302 /swagger-ui/index.html?urls.primaryName=%EB%86%8D%EA%B0%80%20%EC%95%B1; }
location = /docs/receiver { return 302 /swagger-ui/index.html?urls.primaryName=%EC%A0%91%EC%88%98%EC%9E%90%20%EC%9B%B9; }
location = /docs/admin    { return 302 /swagger-ui/index.html?urls.primaryName=%EC%96%B4%EB%93%9C%EB%AF%BC; }
location = /docs/auth     { return 302 /swagger-ui/index.html?urls.primaryName=%EC%9D%B8%EC%A6%9D; }

# 헬스 체크 (DB 연결 상태 포함)
location = /health { proxy_pass http://mnm_api/actuator/health; }

location = / {
    default_type text/plain;
    return 200 "mnm-api nginx ok\n";
}
