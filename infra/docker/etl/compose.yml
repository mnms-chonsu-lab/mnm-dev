# 공공데이터 수집 실행 컨테이너 (스테이징). 서버에서는 /root/mnm-etl/compose.yml 로 둔다.
# - 수집 코드는 mnm-data/etl (@tjdlsry). 이 파일은 실행 환경만 정한다
# - 컨테이너는 대기만 하고, 서버 cron 이 docker exec 로 수집을 실행한다 (mnm-etl.cron)
# - 서버에서 이미지를 빌드하지 않는다. 공식 파이썬 이미지에 켤 때 패키지만 설치 (재시작 때 다시 설치, 약 1분)
services:
  etl:
    image: python:3.12-slim
    container_name: mnm-etl
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir -q 'psycopg[binary]' python-dotenv boto3 pandas requests
      && echo '[mnm-etl] 준비됨' && exec sleep infinity"
    env_file: .env            # DB(mnm_api)·인증키·웹훅. 값은 서버에만 (README)
    environment:
      PYTHONUNBUFFERED: "1"   # 출력을 바로 내보냄. 안 하면 로그 순서가 뒤섞임 (실행: … 줄이 결과 뒤에 찍힘)
    volumes:
      - ./etl:/app/etl:ro     # mnm-data/etl 사본
      - ./run_notify.py:/app/run_notify.py:ro   # 성공 알림 래퍼 (이 폴더)
    mem_limit: 512m           # 제안값, 실측으로 조정 (pandas 사용하는 farm_scale 기준)
    restart: unless-stopped
