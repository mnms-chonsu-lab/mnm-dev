# 스테이징 서버 배포용. deploy.yml이 서버의 ~/mnm/compose.yml 로 복사해서 쓴다.
# 같은 폴더의 .env 에서 값을 읽는다 (키 목록은 레포 루트 .env.example).
services:
  api:
    image: ghcr.io/mnms-chonsu-lab/mnm-api:${IMAGE_TAG:-develop}
    env_file: .env
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    command: ["sh", "/etc/nginx/mnm/start.sh"]
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/mnm:ro
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    depends_on:
      - api
    restart: unless-stopped

  # 인증서 발급·갱신 때만 실행: docker compose run --rm certbot ...
  certbot:
    image: certbot/certbot
    profiles: ["tools"]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot

volumes:
  letsencrypt:
  certbot-www:
