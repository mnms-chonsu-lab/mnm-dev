# 스테이징 서버 배포용. deploy.yml이 서버의 ~/mnm/compose.yml 로 복사해서 쓴다.
# 같은 폴더의 .env 에서 값을 읽는다 (키 목록은 레포 루트 .env.example).
services:
  api:
    image: ghcr.io/mnms-chonsu-lab/mnm-api:${IMAGE_TAG:-develop}
    env_file: .env
    environment:
      # Vercel 프론트 3개 + 로컬 프론트(스테이징 API로 확인할 때). 서버 .env에 값을 넣으면 그 값을 쓴다
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://chonsu-farmer.vercel.app,https://chonsu-receiver.vercel.app,https://chonsu-admin.vercel.app,http://localhost:5173,http://localhost:5174,http://localhost:5175}
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    command: ["sh", "/etc/nginx/mnm/start.sh"]
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/mnm:ro
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
      - nginx-logs:/var/log/nginx/mnm   # 감시 프로그램이 읽는 로그 파일 (common.conf)
    depends_on:
      - api
    restart: unless-stopped

  # 감시·알람 (REQ-OPS-06). 1분마다 API·AI 상태, 5xx 비율, AI 오류율을 보고 기준을 넘으면 웹훅으로 보낸다
  # 웹훅이 비어 있으면 로그에만 남는다: docker compose logs monitor
  monitor:
    image: python:3.12-alpine
    command: ["python", "-u", "/app/monitor.py"]
    environment:   # .env 전체를 넘기지 않고 필요한 값만
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_WEBHOOK_FORMAT: ${ALERT_WEBHOOK_FORMAT:-discord}
    volumes:
      - ./monitor:/app:ro
      - nginx-logs:/logs
    mem_limit: 64m
    depends_on:
      - nginx
    restart: unless-stopped

  # 인증서 발급·갱신 때만 실행: docker compose run --rm certbot ...
  certbot:
    image: certbot/certbot
    profiles: ["tools"]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot

volumes:
  letsencrypt:
  certbot-www:
  nginx-logs:
