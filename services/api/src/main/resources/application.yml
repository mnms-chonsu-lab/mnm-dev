spring:
  application:
    name: mnm-api
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # DB 구조는 mnm-data/migrations 에서만 바꾼다. 여기서는 엔티티와 맞는지만 검사한다.
      ddl-auto: ${JPA_DDL_AUTO:validate}
  jackson:
    # JSON 필드는 snake_case (오류 응답의 request_id 와 맞춤). 시간은 ISO-8601 UTC (예: 2026-11-17T03:00:00Z)
    property-naming-strategy: SNAKE_CASE
  servlet:
    multipart:
      # 파일 1개 10MB (기능명세서 UPLOAD-FAIL 기준). 요청 전체는 nginx client_max_body_size 20m 과 맞춤 (제안값, 실측으로 조정)
      max-file-size: 10MB
      max-request-size: 20MB

mnm:
  cors:
    # 쉼표로 구분. 비우면 CORS 를 열지 않는다 (nginx 같은 도메인으로만 호출할 때)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

logging:
  pattern:
    # 모든 로그 줄에 request_id 를 붙인다 (RequestIdFilter)
    level: "%5p [%X{request_id:-}]"

server:
  # nginx 뒤에서 https 주소를 올바르게 인식 (스웨거 서버 주소 등)
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-components: always
