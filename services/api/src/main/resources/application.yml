spring:
  application:
    name: mnm-api
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # DB 구조는 mnm-data/migrations 에서만 바꾼다. 여기서는 엔티티와 맞는지만 검사한다.
      ddl-auto: ${JPA_DDL_AUTO:validate}
  flyway:
    # db/migration = mnm-data/migrations 사본(V1~), db/seed = 시연용 계정 (R__, 매번 없는 것만 넣음)
    # shortcut: 시드가 기본으로 들어간다. 실서비스 DB 를 만들면 FLYWAY_LOCATIONS=classpath:db/migration 으로 시드를 뺀다
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/seed}
    # Flyway 도입 전에 psql 로 0001~0003 을 적용해 둔 DB 는 V3 까지 적용된 것으로 기록하고 그 다음부터 실행한다
    baseline-on-migrate: true
    baseline-version: ${FLYWAY_BASELINE_VERSION:3}
  jackson:
    # JSON 필드는 snake_case (오류 응답의 request_id 와 맞춤). 시간은 ISO-8601 UTC (예: 2026-11-17T03:00:00Z)
    property-naming-strategy: SNAKE_CASE
  servlet:
    multipart:
      # 파일 1개 10MB (기능명세서 UPLOAD-FAIL 기준). 요청 전체는 nginx client_max_body_size 20m 과 맞춤 (제안값, 실측으로 조정)
      max-file-size: 10MB
      max-request-size: 20MB

mnm:
  auth:
    # 로그인 토큰(JWT, HS256) 서명 키. 32바이트 이상
    jwt-secret: ${JWT_SECRET}
  cors:
    # 쉼표로 구분. 비우면 CORS 를 열지 않는다 (nginx 같은 도메인으로만 호출할 때)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  storage:
    # 사진·영상·음성 원본 (Object Storage, S3 호환). endpoint 를 비우면 가짜 저장소 (파일이 실제로 저장되지 않음)
    endpoint: ${STORAGE_ENDPOINT:}
    region: ${STORAGE_REGION:kr-standard}
    bucket: ${STORAGE_BUCKET:}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
  ai:
    # mnm-ai 내부 API 서버 (docs/api/ai-internal.yaml). 비우면 가짜 AI (음성은 늘 같은 시연 문장으로 인식됨)
    base-url: ${AI_BASE_URL:}
    # AI 서버의 AI_INTERNAL_TOKEN 과 같은 값 (X-Internal-Token 헤더). base-url 을 넣으면 필수
    internal-token: ${AI_INTERNAL_TOKEN:}

logging:
  pattern:
    # 모든 로그 줄에 request_id 를 붙인다 (RequestIdFilter)
    level: "%5p [%X{request_id:-}]"

server:
  # nginx 뒤에서 https 주소를 올바르게 인식 (스웨거 서버 주소 등)
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-components: always
