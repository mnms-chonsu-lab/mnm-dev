# DB 없이 전체 설정을 띄우는 테스트용 프로필 (@ActiveProfiles("nodb")). Hibernate·Flyway 가 시작할 때 DB 에 접속하지 않게 한다
spring.datasource.url=jdbc:postgresql://localhost:1/none
spring.datasource.username=none
spring.datasource.password=none
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.flyway.enabled=false
mnm.auth.jwt-secret=test-only-secret-0123456789-abcdefghij
