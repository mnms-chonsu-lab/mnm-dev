      description: |
        data = { symptom_report_id, matched_count, matched[], required_parts[{ part(mouth|hoof|flank), part_name, guide, guide_rule_id }], disease(FMD|LSD|null) }
        matched_count 는 "예"로 답한 공식 질문 수 (판정 아님). 모두 아니요면 required_parts = [], disease = null (질병 안내 없음)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
