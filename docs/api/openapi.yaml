openapi: 3.0.3
info:
  title: mnm-dev API
  version: 0.0.1
  description: |
    촌수의사 백엔드 API 명세 (초기 뼈대, 엔드포인트 추가 예정)

    공통 규칙
    - JSON 필드 이름은 snake_case. 시간은 ISO-8601 UTC (예: 2026-11-17T03:00:00Z)
    - 성공 응답은 { data, request_id }. 목록은 data 안에 { items, has_next, next_cursor }. 본문이 없으면 204
    - 오류 응답은 ErrorResponse. 농가 화면은 message 만, 접수자·어드민은 request_id 를 "오류 번호"로 표시
    - 모든 응답 헤더에 X-Request-Id (본문의 request_id 와 같은 값)
    - 인증은 Authorization: Bearer {토큰}. 토큰 없음·만료·위조는 AUTH-401, 역할이 맞지 않으면 AUTH-403
      (/api/farmer = 농가, /api/receiver = 접수자, /api/admin = 운영자)
    - 중복되면 안 되는 요청(신고 전달)은 Idempotency-Key 헤더 필수. 없으면 VALID-422, 이미 처리된 키면 CONFLICT-409
paths:
  /api/admin/health:
    get:
      tags: [어드민]
      summary: 서비스 상태 (ADM-01, A-S01)
      description: |
        data = { components[], checked_at }. components 순서는 api · db · ai · etl.
        - component = { key, status(normal|delayed|error|unknown), detail, last_at }
        - ai: 최근 1시간 inference_log. 오류율 5% 초과 = error, 평균 지연 3초 초과 = delayed (제안값, 실측으로 조정). 호출이 없으면 unknown. detail = 평균 지연 ("820ms")
        - etl: 작업별 마지막 실행 중 하나라도 failed 면 error, detail = 실패한 작업 이름(쉼표). 실행 기록이 없으면 unknown
        - DB 가 안 되면 db = error, ai · etl = unknown (200 으로 응답)
      responses:
        '200': { description: 구성요소별 상태 }
  /api/admin/metrics/today:
    get:
      tags: [어드민]
      summary: 오늘 수치 (ADM-01, A-S01)
      description: |
        한국 시간 0시(since)부터. data = { records, deliveries, pending_receipts, ai_error_rate, since }
        - records = 일지 기록("신고" 자동 줄 제외) + 소 상태 기록
        - pending_receipts = 도착한 전달 중 마지막 처리 상태가 처리 완료가 아닌 것
        - ai_error_rate = 0~1, 오늘 AI 호출이 없으면 null
      responses:
        '200': { description: 오늘 수치 }
  /api/admin/users:
    get:
      tags: [어드민]
      summary: 사용자 목록·검색 (ADM-02, A-S02)
      description: |
        최근에 만든 계정부터 20개씩. 연락처는 마스킹(010-****-0937).
        items[] = { users_id, role, name, login_id, phone_masked, org_id, org_name, farm_no, farm_name, status, last_login_at }
        (org = 접수자 소속 기관 또는 농가 담당 축협)
      parameters:
        - { name: role, in: query, schema: { type: string, enum: [farmer, receiver, admin] } }
        - { name: status, in: query, schema: { type: string, enum: [active, suspended, invited] } }
        - { name: org_id, in: query, schema: { type: integer }, description: 소속 기관 또는 담당 축협 }
        - { name: q, in: query, schema: { type: string }, description: 이름·아이디·연락처·농장명·농장식별번호 부분 일치 }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200': { description: 'PageResponse' }
    post:
      tags: [어드민]
      summary: 계정 만들기 (ADM-03, A-P01)
      description: |
        역할별 필수 칸 — 농가: farm_no · name · phone(휴대폰) / 접수자: name · login_id · org_id / 운영자: name · login_id.
        농가는 농장(farm_info)도 함께 만들고 비밀번호가 없다(farm_name 이 없으면 "{이름} 농장"). 주소 → 법정동·위경도 변환은 아직 없어 region_code 를 직접 받는다.
        접수자·운영자는 임시 비밀번호를 만들어 이 응답에서만 한 번 보여준다(첫 로그인 때 R-S06). 감사 기록(create · user)을 남긴다.
        data = { users_id, role, login_id, temp_password }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role, name]
              properties:
                role: { type: string, enum: [farmer, receiver, admin] }
                name: { type: string, maxLength: 50 }
                phone: { type: string, example: 010-0000-3390 }
                farm_no: { type: string, pattern: '^\d{6}$' }
                farm_name: { type: string }
                address: { type: string }
                head_count: { type: integer, minimum: 0 }
                region_code: { type: string, pattern: '^\d{10}$' }
                org_id: { type: integer, description: '접수자 소속 기관 · 농가 담당 축협' }
                login_id: { type: string, pattern: '^[A-Za-z0-9._-]{3,50}$' }
                inbox_id: { type: string, description: 접수자 소속 수신함 (그 기관의 수신함만) }
      responses:
        '201': { description: 만든 계정 }
        '409': { description: 'CONFLICT-409 (농장식별번호 · 농가 휴대폰 · 아이디 중복, message 로 구분)' }
        '422': { description: VALID-422 (역할별 필수 칸 없음 · 없는 기관 · 기관에 없는 수신함) }
  /api/admin/users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [어드민]
      summary: 사용자 상세 (ADM-02, A-S03 · A-S03F)
      description: |
        data = { users_id, role, name, login_id, phone_masked, status, must_change_pw, locked, last_login_at, created_at, org_id, org_name, inbox_id, farm }
        farm(농가만) = { farm_id, farm_no, name, address, region_code, head_count, org_id, org_name, cow_count, records30d, delivered_count }. 기록 내용은 주지 않는다
      responses:
        '200': { description: 사용자 상세 }
        '404': { description: NF-404 }
    patch:
      tags: [어드민]
      summary: 계정 수정 · 정지 · 비밀번호 초기화 (ADM-04, A-S03 · A-S03F)
      description: |
        보낸 칸만 바꾼다. 농가: phone · org_id(담당 축협) · status / 접수자·운영자: phone · org_id · inbox_id · status · reset_password.
        기관을 옮기면 inbox_id 를 같이 보내지 않는 한 수신함은 비운다. 내 계정은 정지할 수 없다.
        reset_password=true 면 새 임시 비밀번호 + 잠금 해제 + 다음 로그인 때 R-S06 (농가는 VALID-422).
        감사 기록: 칸 변경 = update, 초기화 = password_reset. data = { user(상세와 같음), temp_password }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [active, suspended] }
                phone: { type: string }
                org_id: { type: integer }
                inbox_id: { type: string }
                reset_password: { type: boolean }
      responses:
        '200': { description: 바뀐 계정 }
        '404': { description: NF-404 }
        '409': { description: CONFLICT-409 (농가 휴대폰 중복) }
        '422': { description: VALID-422 }
  /api/admin/orgs:
    get:
      tags: [어드민]
      summary: 접수 기관 목록 (ADM-05, A-S09)
      description: |
        한 번에 준다(has_next=false). items[] = { org_id, name, type, region_codes[], phone, inboxes[], receiver_count }
        inboxes[] = { inbox_id, type(history|biosecurity), name, phone, receiver_count } — receiver_count 0 이면 화면에 "받는 사람 없음"
      responses:
        '200': { description: 'PageResponse' }
    post:
      tags: [어드민]
      summary: 기관 추가 (ADM-05, A-S09)
      description: 새 수신함은 inbox_id 없이 보내면 서버가 만든다. 감사 기록(create · receiver_org)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminOrgRequest' }
      responses:
        '201': { description: 만든 기관 (목록 한 줄과 같은 모양) }
        '422': { description: VALID-422 }
  /api/admin/orgs/{id}:
    patch:
      tags: [어드민]
      summary: 기관 수정 (ADM-05, A-S09)
      description: |
        편집 패널의 전체 값을 보낸다. 기존 수신함은 inbox_id 를 그대로, 새 수신함은 inbox_id 없이.
        접수자가 남아 있는 수신함을 빼면 CONFLICT-409. 감사 기록(update · receiver_org)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminOrgRequest' }
      responses:
        '200': { description: 바뀐 기관 }
        '404': { description: NF-404 }
        '409': { description: CONFLICT-409 (접수자가 있는 수신함 삭제) }
        '422': { description: VALID-422 (이 기관에 없는 inbox_id · 중복) }
  /api/admin/guides:
    get:
      tags: [어드민]
      summary: 안내 문구 목록 (ADM-07, A-S05)
      description: |
        분류별 화면 순서(display_order)대로 한 번에 준다. items[] = { biosecurity_rule_id, kind, disease, stage, text, source_doc, clause,
        revised_at, display_order, example_image, part_code, photo_part, yes_required_parts[], status, reviewer, version }
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [question, photo_guide, action, form_field, summary, clause] } }
        - { name: status, in: query, schema: { type: string, enum: [draft, review, published] } }
        - { name: disease, in: query, schema: { type: string } }
      responses:
        '200': { description: 'PageResponse' }
    post:
      tags: [어드민]
      summary: 안내 문구 등록 (ADM-07, A-S05)
      description: 초안(draft, version 1)으로 만든다. text 는 공식 자료 원문 그대로. 감사 기록(create · biosecurity_rule)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, content]
              properties:
                kind: { type: string, enum: [question, photo_guide, action, form_field, summary, clause] }
                content: { $ref: '#/components/schemas/AdminGuideContent' }
      responses:
        '201': { description: 만든 문구 }
        '422': { description: VALID-422 }
  /api/admin/guides/{id}:
    patch:
      tags: [어드민]
      summary: 안내 문구 수정 · 검수 · 게시 (ADM-08, A-S05)
      description: |
        content 를 보내면 내용 전체를 바꾼다. 게시된 문구면 그 문구는 그대로 두고 새 버전(version+1, draft)을 만들어 돌려준다(새 biosecurity_rule_id).
        status: draft → review → published. 초안에서 바로 게시하면 VALID-422. 게시할 때 reviewer(없으면 운영자 이름)를 남기고,
        같은 자리(분류·질병·단계·순서·부위·조항)의 이전 게시 버전은 draft 로 내려 보관한다.
        감사 기록: 내용 변경 = update(새 버전은 create), 게시 = publish
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content: { $ref: '#/components/schemas/AdminGuideContent' }
                status: { type: string, enum: [draft, review, published] }
                reviewer: { type: string, maxLength: 50 }
      responses:
        '200': { description: 바뀐 문구 (새 버전을 만들었으면 새 버전) }
        '404': { description: NF-404 }
        '422': { description: VALID-422 }
  /api/admin/audit-logs:
    get:
      tags: [어드민]
      summary: 감사 로그 (ADM-12, A-S08)
      description: |
        최근순 20개씩. 기간은 [from, to). items[] = { audit_log_id, at, users_id, user_name, user_role, action, target_type, target_id }
        action: create · update · publish · password_reset (어드민) / view 등 (접수자 API 가 남긴다)
      parameters:
        - { name: users_id, in: query, schema: { type: integer } }
        - { name: action, in: query, schema: { type: string } }
        - { name: target_type, in: query, schema: { type: string }, description: 'user · receiver_org · biosecurity_rule 등' }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200': { description: 'PageResponse' }
  /api/auth/farmer/login:
    post:
      tags: [인증]
      summary: 농가 로그인 (AUTH-01, F-S00)
      description: |
        농장식별번호 + 휴대폰 번호(하이픈 있어도 됨)가 같은 계정이면 토큰(30일)을 준다. 가입 없음 — 계정은 어드민에서 만든다.
        틀린 횟수는 그 농장 계정에 센다. 5번째에 10분 잠금(AUTH-LOCK, message 에 남은 분). 정지 계정은 AUTH-SUSPENDED.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [farm_no, phone]
              properties:
                farm_no: { type: string, pattern: '^\d{6}$', example: '448012' }
                phone: { type: string, example: 010-0000-0937 }
      responses:
        '200': { $ref: '#/components/responses/Login' }
        '401': { description: AUTH-FAIL }
        '403': { description: AUTH-SUSPENDED (정지된 계정) }
        '422': { description: VALID-422 }
        '423': { description: AUTH-LOCK }
  /api/auth/login:
    post:
      tags: [인증]
      summary: 접수자·운영자 로그인 (AUTH-02, R-S01)
      description: |
        운영자가 발급한 아이디·비밀번호. 토큰 8시간. 운영자도 같은 API (role 로 화면 구분).
        must_change_pw 가 true(임시 비밀번호)면 AUTH-04 로 바꾸기 전까지 /api/receiver · /api/admin 은 AUTH-403.
        잠금·정지는 농가 로그인과 같다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login_id, password]
              properties:
                login_id: { type: string, example: hs-bio }
                password: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Login' }
        '401': { description: AUTH-FAIL }
        '403': { description: AUTH-SUSPENDED (정지된 계정) }
        '423': { description: AUTH-LOCK }
  /api/auth/password:
    post:
      tags: [인증]
      summary: 임시 비밀번호 변경 (AUTH-04, R-S06)
      description: 임시 비밀번호로 로그인한 토큰으로만 부른다(아니면 AUTH-403). 새 토큰을 돌려준다. 확인 칸 일치는 화면에서 검사
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_password]
              properties:
                new_password: { type: string, description: '8자 이상 영문·숫자 조합, 임시 비밀번호와 달라야 함' }
      responses:
        '200': { $ref: '#/components/responses/Login' }
        '403': { description: AUTH-403 (임시 비밀번호 상태가 아님) }
        '422': { description: VALID-422 (규칙 위반 · 임시 비밀번호와 같음) }
  /api/auth/me:
    get:
      tags: [인증]
      summary: 내 계정·역할·소속 (AUTH-03)
      responses:
        '200':
          description: 농가는 farm, 접수자는 org · inbox_id 가 채워진다
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      users_id: { type: integer }
                      role: { type: string, enum: [farmer, receiver, admin] }
                      name: { type: string }
                      phone: { type: string, nullable: true }
                      login_id: { type: string, nullable: true }
                      must_change_pw: { type: boolean }
                      org:
                        type: object
                        nullable: true
                        properties:
                          org_id: { type: integer }
                          name: { type: string }
                          type: { type: string }
                          region_codes: { type: array, items: { type: string } }
                      inbox_id: { type: string, nullable: true }
                      farm:
                        type: object
                        nullable: true
                        properties:
                          farm_id: { type: integer }
                          farm_no: { type: string }
                          name: { type: string }
                          head_count: { type: integer, nullable: true }
                          org_id: { type: integer, nullable: true, description: 담당 축협 }
                          org_name: { type: string, nullable: true }
                  request_id: { type: string }
        '401': { description: AUTH-401 }
  /api/farmer/home:
    get:
      tags: [농가 앱]
      summary: 홈 요약 (FARM-05, F-S01)
      description: |
        data = { farmer_name, task_count, tasks[], unread_alert_count, region }
        - tasks: 끝내지 않은 할 일, 기한 임박순. { tasks_id, kind(birth_report|death_report|move_report|ear_tag), title, due_date, d_day, ref_id(이력 신고서 번호) }
        - region: FARM-17 /region/outbreaks 와 같음
      responses:
        '200': { description: 홈 요약 }
  /api/farmer/region/outbreaks:
    get:
      tags: [농가 앱]
      summary: 우리 지역 발생 현황 (FARM-17, F-S01)
      description: |
        농장 법정동 앞 5자리(시군구) 기준 최근 30일. data = { region_name, fmd_count, lsd_count, base_at(수집 기준 시각) }
        농장 지역 코드가 없으면 region_name = null, 건수 0. 수집 실패 시 직전 값·기준 시각 그대로
      responses:
        '200': { description: 지역 발생 건수 }
  /api/farmer/facilities/nearest:
    get:
      tags: [농가 앱]
      summary: 가장 가까운 거점소독시설 (FARM-17, F-S14)
      description: |
        농장 위경도 기준 직선거리 최소 1곳. data = { name, address, distance_km(소수 1자리), operating_hours, phone }
        농장 위경도·시설 정보가 없으면 data = null
      responses:
        '200': { description: 거점소독시설 }
  /api/farmer/records/voice:
    post:
      tags: [농가 앱]
      summary: 음성 기록 → 정리 초안 (FARM-03, F-S02)
      description: |
        음성 → 문장(/ai/stt) → 정리(/ai/route). 저장하지 않는다(확인 후 FARM-04). 음성 원본도 저장하지 않는다 (MVP).
        음성을 못 알아들으면 200 + fallback=text_input (글로 쓰기 F-S02T). 응답 형식은 FARM-25 와 같다.
        AI 서버 배포 전에는 mock (음성 내용과 상관없이 시연 문장 S1 을 돌려준다)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio]
              properties:
                audio: { type: string, format: binary, description: 'audio/webm · audio/mp4(m4a), 60초 이하, 10MB 이하' }
      responses:
        '200': { $ref: '#/components/responses/RecordDraft' }
        '413': { description: UPLOAD-FAIL }
        '422': { description: VALID-422 (빈 파일 · 음성 형식 아님) }
  /api/farmer/records/text:
    post:
      tags: [농가 앱]
      summary: 글 기록 → 정리 초안 (FARM-25, F-S02T)
      description: 정리하지 못하면 200 + fallback=select_input (선택형 입력 F-S03E)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 2000, example: 어젯밤에 0871번이 송아지 낳았어. 암컷이야. }
      responses:
        '200': { $ref: '#/components/responses/RecordDraft' }
        '422': { description: VALID-422 }
  /api/farmer/diary:
    get:
      tags: [농가 앱]
      summary: 일지 목록 (FARM-04, F-S15)
      description: |
        날짜별 묶음, 30일씩 최근순 (기록 없는 기간은 건너뜀). items = [{ date, entries[] }]
        entry = { entry_id, date, category, cow_id, cow_tag4, value, vaccine_type, head_count }
        category: 사육현황 · 접종 · 소독 · 관찰 · 출입 · 출생 · 폐사 · 이동 · 메모 + 신고(서버 자동 기록)
      parameters:
        - { name: cursor, in: query, required: false, schema: { type: string, format: date }, description: 이전 응답의 next_cursor }
      responses:
        '200': { description: 'PageResponse<{ date, entries[] }>' }
    post:
      tags: [농가 앱]
      summary: 일지 저장 (FARM-04, F-S03)
      description: |
        확인된 항목만 저장한다. report 가 있으면 이력 신고서 초안 + 기한 할 일(발생일이 있을 때)도 같은 트랜잭션으로 만든다.
        data = { entry_ids[], history_report(FARM-06 과 같은 형식 | null) }. 신고서 빈칸이 있으면 F-S04Q 로
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                date: { type: string, format: date, description: '없으면 오늘(한국 시각). 미래 날짜는 VALID-422' }
                raw_text: { type: string, maxLength: 2000, description: 원래 말 (F-S15D) }
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [category]
                    properties:
                      category: { type: string, enum: [사육현황, 접종, 소독, 관찰, 출입, 출생, 폐사, 이동, 메모] }
                      value: { type: string, maxLength: 500 }
                      cow_id: { type: integer, nullable: true, description: '내 소가 아니면 CATTLE-NOTFOUND' }
                      vaccine_type: { type: string, maxLength: 50 }
                      head_count: { type: integer, minimum: 0 }
                report:
                  type: object
                  nullable: true
                  required: [type]
                  properties:
                    type: { type: string, enum: [출생, 폐사, 양도, 양수, 이동] }
                    fields: { $ref: '#/components/schemas/ReportFields' }
      responses:
        '201': { description: 저장됨 }
        '404': { description: CATTLE-NOTFOUND }
        '422': { description: 'VALID-422 (분류 · 날짜 · 신고서 칸 형식, 목록에 없는 귀표)' }
  /api/farmer/diary/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [농가 앱]
      summary: 일지 기록 한 건 보기 (FARM-26, F-S15D)
      description: |
        data = { entry, raw_text, deliveries[] }. deliveries: 이 기록이 함께 보내진 소 상태 기록 전달
        (기록일부터 14일 안에 승인된 전달) { delivery_id, approved_at, org_name, receiver_status(new|checking|done) }
      responses:
        '200': { description: 일지 기록 }
        '404': { description: NF-404 }
    patch:
      tags: [농가 앱]
      summary: 일지 기록 고치기 (FARM-26, F-S03E)
      description: 보낸 값으로 바꾼다 (원래 말은 그대로). 서버가 남긴 '신고' 기록은 VALID-422
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category]
              properties:
                date: { type: string, format: date }
                category: { type: string, enum: [사육현황, 접종, 소독, 관찰, 출입, 출생, 폐사, 이동, 메모] }
                value: { type: string, maxLength: 500 }
                cow_id: { type: integer, nullable: true }
                vaccine_type: { type: string }
                head_count: { type: integer }
      responses:
        '200': { description: 고친 기록 (entry 형식) }
        '404': { description: NF-404 · CATTLE-NOTFOUND }
        '422': { description: VALID-422 }
    delete:
      tags: [농가 앱]
      summary: 일지 기록 지우기 (FARM-26)
      description: 이미 전달된 기록은 받은 곳의 사본이 남는다 (화면에서 안내)
      responses:
        '204': { description: 지움 }
        '404': { description: NF-404 }
  /api/farmer/history-reports/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [농가 앱]
      summary: 이력 신고서 초안 (FARM-06, F-S04 · F-S04D · F-S04M)
      responses:
        '200': { $ref: '#/components/responses/HistoryReport' }
        '404': { description: NF-404 }
    patch:
      tags: [농가 앱]
      summary: 신고서 빈칸 채우기 (FARM-07, F-S04Q · F-P02)
      description: |
        보낸 칸만 바꾸고 null 은 지운다. 빈칸·다음 질문·기한·기한 할 일을 다시 계산한다. 초안일 때만 (아니면 CONFLICT-409).
        type 은 양도·양수·이동끼리만 바꿀 수 있다. 소 칸은 내 소 목록(뺀 소 포함)의 끝 4자리 또는 12자리 (양수는 목록 확인 안 함)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fields]
              properties:
                type: { type: string, enum: [양도, 양수, 이동] }
                fields: { $ref: '#/components/schemas/ReportFields' }
      responses:
        '200': { $ref: '#/components/responses/HistoryReport' }
        '409': { description: CONFLICT-409 (이미 보낸 신고서) }
        '422': { description: 'VALID-422 (알 수 없는 칸 · 형식 · 미래 날짜 · 목록에 없는 귀표)' }
  /api/farmer/history-reports/{id}/copy-text:
    get:
      tags: [농가 앱]
      summary: 직접 제출용 항목 텍스트 (FARM-08, F-S05)
      description: 'data = { title, lines[{ label, value }], text(줄바꿈 구분, 빈칸은 "(빈칸)"), can_submit }'
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: 복사용 항목 }
  /api/farmer/history-reports/{id}/submit:
    post:
      tags: [농가 앱]
      summary: 신고 마침 · 축협에 부탁 (FARM-09, F-S05 · F-S06)
      description: |
        - self: 빈칸이 없어야 한다(있으면 VALID-422). 상태 done, 폐사·양도 소는 목록에서 빼기, 출생이고 송아지 귀표가 없으면 귀표 30일 할 일 등록(ear_tag_due)
        - coop: 빈칸이 있어도 된다. Idempotency-Key 필수. 담당 축협 수신함으로 전달(deliveries), 상태 sent
        - 둘 다 신고 기한 할 일을 끝내고 일지에 '신고'를 남긴다. 초안이 아니면 CONFLICT-409
        data = { history_report_id, status, mode, delivery_id, org_name, ear_tag_due }
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string, maxLength: 64 }, description: mode=coop 일 때 필수 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { type: string, enum: [self, coop] }
      responses:
        '200': { description: 제출 결과 }
        '409': { description: CONFLICT-409 (이미 보냄 · 같은 Idempotency-Key) }
        '422': { description: VALID-422 (직접 제출인데 빈칸 · 키 없음) }
        '500': { description: DELIVER-FAIL (담당 축협 없음) }
  /api/farmer/farms/me/cows:
    get:
      tags: [농가 앱]
      summary: 소 목록 (FARM-02, F-S08 · F-S18)
      description: |
        목록에 있는 소(active). 최근 일지가 있는 소 먼저, 그다음 끝 4자리 순. 페이지 없음(has_next=false).
        item = { cow_id, tag_last4, tag_full, breed, sex, birth_date, age_years, barn, vaccine_last_date, vaccine_last_order, source(trace|manual), trace_checked_at, status }
      responses:
        '200': { description: 'PageResponse<cow>' }
    post:
      tags: [농가 앱]
      summary: 소 등록 (FARM-23, F-P04 · F-P04N)
      description: |
        서버가 이력제를 다시 조회해 그 값을 그대로 저장한다(source=trace). 못 찾거나 조회가 안 되면 sex·birth_date 로 등록(source=manual).
        다른 농장 소면 CATTLE-OTHER-FARM → 농가 확인 후 confirm_other_farm=true 로 다시 보낸다. 이미 등록된 귀표는 CONFLICT-409.
        AI·데이터 연동 전에는 이력제 조회가 mock 이다: 마지막 자리 0 = 못 찾음, 008… = 다른 농장, 009… = 조회 실패
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tag_no]
              properties:
                tag_no: { type: string, example: 002 1234 5678 9, description: 귀표 12자리 (띄어쓰기·하이픈 무시) }
                barn: { type: string, maxLength: 50 }
                sex: { type: string, enum: [암, 수], description: 직접 입력일 때 필수 }
                birth_date: { type: string, example: 2024-01, description: 'YYYY-MM 또는 YYYY-MM-DD (일을 모르면 1일). 직접 입력일 때 필수' }
                confirm_other_farm: { type: boolean, default: false }
      responses:
        '201': { description: 등록된 소 (FARM-02 item 형식) }
        '409': { description: CONFLICT-409 (이미 등록) · CATTLE-OTHER-FARM }
        '422': { description: VALID-422 (귀표 형식 · 직접 입력 값 없음) }
  /api/farmer/cows/lookup:
    get:
      tags: [농가 앱]
      summary: 귀표 → 이력제 조회 (FARM-22, F-P04)
      description: 'data = { tag_no, breed, sex, birth_date, vaccine_last_date, vaccine_last_order, already_registered }. 값은 가공하지 않는다'
      parameters:
        - { name: tag_no, in: query, required: true, schema: { type: string }, description: 귀표 12자리 }
      responses:
        '200': { description: 조회 결과 }
        '404': { description: CATTLE-NOTFOUND }
        '409': { description: CATTLE-OTHER-FARM }
        '422': { description: VALID-422 (12자리 아님) }
        '502': { description: TRACE-API-FAIL (직접 입력으로 등록) }
  /api/farmer/cows/{id}:
    patch:
      tags: [농가 앱]
      summary: 축사 수정 · 목록에서 빼기 (FARM-24, F-P05)
      description: |
        barn 은 보낼 때만 바꾼다(빈 문자열 = 지움). remove_reason 을 보내면 목록에서 뺀다(지난 기록은 남음).
        create_report=true 면 폐사 → 폐사 신고서, 팔림 → 양도 신고서 초안을 만든다(날짜는 비워 둠). data = { cow, history_report_id }
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                barn: { type: string, maxLength: 50 }
                remove_reason: { type: string, enum: [팔림, 폐사, 기타] }
                create_report: { type: boolean, default: false }
      responses:
        '200': { description: 바뀐 소 }
        '404': { description: CATTLE-NOTFOUND (내 농장 소 아님) }
  /api/farmer/guide/questions:
    get:
      tags: [농가 앱]
      summary: 공식 증상 질문 (FARM-10, F-S09)
      description: |
        게시된 질문만, 순서대로 (침 → 물집 → 사료 → 혹). 페이지 없음.
        item = { rule_id, answer_key(drool|blister|feed|lump, FARM-11 답 키), text, example_image, yes_required_parts[], source_doc, clause }
      responses:
        '200': { description: 'PageResponse<question>' }
  /api/farmer/symptom-reports:
    post:
