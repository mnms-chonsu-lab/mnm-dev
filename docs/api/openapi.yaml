                cow_id: { type: integer, nullable: true, description: '없으면 "귀표 번호를 모르겠어요"' }
                answers:
                  type: object
                  required: [drool, blister, feed, lump]
                  properties:
                    drool: { type: string, enum: [yes, no, unknown] }
                    blister: { type: string, enum: [yes, no, unknown] }
                    feed: { type: string, enum: [yes, no, unknown] }
                    lump: { type: string, enum: [yes, no, unknown] }
                observed_text: { type: string, maxLength: 1000, description: 본 것 말하기 (F-S08S) }
                head_count: { type: integer, description: 이런 모습인 소 수 }
                found_date: { type: string, format: date, description: 처음 본 날 (없으면 오늘) }
                barn: { type: string, description: 없으면 소의 축사 }
                dead_count: { type: integer }
      responses:
        '201': { description: 저장됨 }
        '404': { description: CATTLE-NOTFOUND }
        '422': { description: VALID-422 }
  /api/farmer/symptom-reports/{id}/summary:
    get:
      tags: [농가 앱]
      summary: 오늘 기록 요약 (FARM-14, F-S11 · F-S19)
      description: |
        data = { symptom_report_id, cow, matched_count, matched[], observed_text, head_count, found_date, barn,
        related_diary[](같은 소 최근 7일), vaccine{ date, value }, photos[{ media_id, part, match }], disease, delivered(QR 표시),
        form6{6개 항목, 빈칸 null}, form6_text(인터넷 신고서 복사용, 빈칸 "(빈칸)") }
        6개 항목은 요약 규칙(/ai/summary, 지금은 mock)으로 만들고, 실패하면 form6 = null (원본 기록만 표시)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: 오늘 기록 요약 }
        '404': { description: NF-404 }
  /api/farmer/guide/actions:
    get:
      tags: [농가 앱]
      summary: 질병별 지금 할 일 (FARM-16, F-S14)
      description: 'disease = FARM-11 응답의 disease. 게시된 조치 문구 원문, 신고 직후 단계 우선, 최대 3개. data = { disease, guide_name, actions[{ rule_id, text, source_doc, clause, revised_at }] }'
      parameters:
        - { name: disease, in: query, required: true, schema: { type: string, enum: [FMD, LSD] } }
      responses:
        '200': { description: 지금 할 일 }
        '422': { description: VALID-422 }
  /api/farmer/deliveries:
    post:
      tags: [농가 앱]
      summary: 승인 → 전달 (FARM-15, F-S13 · F-S13P)
      description: |
        농가가 [네, 보낼게요]를 누른 뒤에만 부른다. 요약 카드(report_summary)를 만들고 경로별 수신함으로 전달한다.
        - coop: 담당 축협 / gov: 관할 시군청 (농장 지역 코드, 없으면 담당 축협 관할로 찾음)
        - call · web: send_to_coop 이면 담당 축협(cc_org)에만 전달, 끄면 전달 없이 일지에만 (status = not_sent)
        - 일지에 '신고'를 남긴다. 받을 기관이 없으면 DELIVER-FAIL
        data = { delivery_id, route, status(delivered|not_sent), org_name, cc_org_name, approved_at, disease, form6_text }
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symptom_report_id, route]
              properties:
                symptom_report_id: { type: integer }
                route: { type: string, enum: [call, coop, web, gov] }
                send_to_coop: { type: boolean, default: true }
                share_phone: { type: boolean, default: true }
                approved_at: { type: string, format: date-time, description: '누른 시각 (대기열에서 나중에 보낼 때). 없으면 서버 시각' }
      responses:
        '201': { description: 전달 결과 }
        '404': { description: NF-404 (소 상태 기록 없음) }
        '409': { description: CONFLICT-409 (같은 Idempotency-Key) }
        '422': { description: VALID-422 (키 없음 · 형식) }
        '500': { description: DELIVER-FAIL }
  /api/farmer/deliveries/mine:
    get:
      tags: [농가 앱]
      summary: 내가 보낸 기록 · 접수 상태 (FARM-27, F-S17S)
      description: |
        최근순 20건. item = { delivery_id, approved_at, kind(symptom|history), title, route, org_name, status,
        receiver_status(new|checking|done), receiver_result, symptom_report_id, history_report_id }
      parameters:
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses:
        '200': { description: 'PageResponse<sent>' }
  /api/farmer/alerts:
    get:
      tags: [농가 앱]
      summary: 알림 목록 (FARM-18, F-S16)
      description: |
        최근순 20건. 연 알림은 읽음(read_at)으로 표시한다 → 홈 미확인 수가 줄어든다.
        item = { alerts_id, kind(diff|deadline|result), title, body, ref_id, feedback(seen|ok|null), read_at, created_at }
        MVP 는 알림 생성 스케줄러(기한 D-3·D-1·평소와 다름)를 만들지 않는다. 처리 결과 알림은 접수자 상태 변경(RCV-03)에서 생긴다
      parameters:
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses:
        '200': { description: 'PageResponse<alert>' }
  /api/farmer/alerts/{id}/feedback:
    post:
      tags: [농가 앱]
      summary: 확인함 · 문제 없음 (FARM-19, F-S16)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [feedback]
              properties:
                feedback: { type: string, enum: [seen, ok] }
      responses:
        '200': { description: 피드백 반영된 알림 }
        '404': { description: NF-404 }
  /api/farmer/me/settings:
    get:
      tags: [농가 앱]
      summary: 화면 설정 (FARM-20, F-S17)
      description: 'data = { font_step(0~4), high_contrast, auto_speak }. 저장한 적 없으면 기본값 (1, false, false)'
      responses:
        '200': { description: 설정 }
    patch:
      tags: [농가 앱]
      summary: 화면 설정 바꾸기 (FARM-20, COM-03)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                font_step: { type: integer, minimum: 0, maximum: 4 }
                high_contrast: { type: boolean }
                auto_speak: { type: boolean }
      responses:
        '200': { description: 바뀐 설정 }
        '422': { description: VALID-422 }
  /api/farmer/me/farm:
    get:
      tags: [농가 앱]
      summary: 농장 정보 (FARM-20, F-S17)
      description: 'data = { farm_no, farm_name, address, owner_name, phone, head_count, org_name, cow_count, sent_count }'
      responses:
        '200': { description: 농장 정보 }
    patch:
      tags: [농가 앱]
      summary: 연락처 바꾸기 (FARM-20, F-P06)
      description: 바꾼 번호로 다음에 로그인한다(숫자만 저장). 다른 농가와 같은 번호면 CONFLICT-409
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, example: 010-0000-0937 }
      responses:
        '200': { description: 농장 정보 }
        '409': { description: CONFLICT-409 }
        '422': { description: VALID-422 }
  /api/receiver/inbox:
    get:
      tags: [접수자 웹]
      summary: 관할 접수 목록 (RCV-01, R-S02)
      description: |
        우리 기관이 받은(또는 전화 경로에서 함께 받은) 도착한 전달만. 최신순 20건.
        data = { counts{ all, new, checking, done }, outbreak{ fmd, lsd, base_at }, page(PageResponse<item>) }
        - item = { delivery_id, kind(symptom|history), status(new|checking|done), result, farm_name, address, region_code,
          cow_tag4, matched_count(소 상태 기록), history_type · history_report_id · due_date(이력 신고서), route, approved_at, received_at }
        - 처리 기록이 없으면 new. outbreak 는 관할 시군구 최근 30일 발생 건수
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [all, new, checking, done], default: all } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses:
        '200': { description: 접수 목록 }
        '403': { description: AUTH-403 (접수자 아님 · 소속 기관 없음) }
        '422': { description: VALID-422 (status 값 오류) }
  /api/receiver/inbox/{id}:
    get:
      tags: [접수자 웹]
      summary: 한 장 요약 (RCV-02, R-S02)
      description: |
        열면 감사 기록(view, delivery)을 남긴다. 관할 밖이면 AUTH-403.
        data = { delivery_id, kind, status, result, route, approved_at, received_at, farm, symptom, history, basics, diary[], timeline[], guides[] }
        - farm = { farm_id, farm_no, name, owner_name, address, head_count, phone_shared, phone(공개했을 때만, 아니면 null) }
        - symptom(소 상태 기록) = { symptom_report_id, cow{ tag4, tag_full, breed, sex, birth_date }, matched_symptoms[], matched_count,
          found_at, barn, photos[{ media_id, requested_part, predicted_part, match }], card(승인 때 만든 요약 카드, 없으면 null) }
          사진 원본 주소(서명 URL)는 이미지 저장소 연결 후 추가
        - history(이력 신고서) = { history_report_id, type, fields, missing[], due_date, d_day, status }
        - basics = { vaccine, disinfection, visit } 일지에서 분류별 가장 최근 값. diary = 최근 14일 일지
        - timeline = [{ status, result, memo, at, user_name, org_name }] 상태 변경 · 메모마다 1건
        - guides = [{ source_doc, revised_at }] 질병 분기에 맞는 게시된 지침 요약 + 질병 구분 없는 법령
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer }, description: deliveries_id }
      responses:
        '200': { description: 한 장 요약 }
        '403': { description: AUTH-403 (관할 밖) }
        '404': { description: NF-404 }
  /api/receiver/inbox/{id}/status:
    patch:
      tags: [접수자 웹]
      summary: 처리 상태 변경 (RCV-03, R-S02 · R-P04)
      description: |
        new → checking(확인 시작) → done(처리 완료, result 필수), done → checking(다시 열기). 처리 기록(receiver_check)을 1건 추가한다.
        - expected_status 는 화면에서 보던 상태. 지금 상태와 다르면 CONFLICT-409 (다른 담당자가 먼저 처리함 → 화면은 다시 읽기)
        - 이력 신고서는 done 으로 바꿀 수 없다 (RCV-10 으로 마침). 바꿀 수 없는 흐름은 VALID-422
        - 바뀌면 농가 알림(kind=result, ref_id=deliveries_id)을 만든다. 처리 완료면 body = 처리 결과 이름
        - result 코드는 제안값 (receiver_check.result 표준 목록 확정 전)
        data = { delivery_id, status, result, at }
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, expected_status]
              properties:
                status: { type: string, enum: [checking, done] }
                expected_status: { type: string, enum: [new, checking, done] }
                result:
                  type: string
                  enum: [inspection_request, vet_guide, observe_guide, not_applicable]
                  description: 방역기관 검사 요청 · 수의사 진료 안내 · 경과 관찰 안내 · 공식 증상 해당 없음
                memo: { type: string, maxLength: 1000 }
      responses:
        '200': { description: 바뀐 상태 }
        '403': { description: AUTH-403 (관할 밖) }
        '404': { description: NF-404 }
        '409': { description: CONFLICT-409 (보던 상태가 이미 바뀜) }
        '422': { description: VALID-422 (결과 없음 · 바꿀 수 없는 흐름) }
  /api/receiver/inbox/{id}/memos:
    post:
      tags: [접수자 웹]
      summary: 통화 · 처리 메모 (RCV-04, R-P01)
      description: 처리 이력에 메모 1건 추가. 새로 도착한 기록이면 확인 중으로 바꾸고 농가 알림을 만든다. data = { delivery_id, status, result, at }
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [memo]
              properties:
                memo: { type: string, maxLength: 1000 }
      responses:
        '201': { description: 메모 저장 }
        '403': { description: AUTH-403 (관할 밖) }
        '422': { description: VALID-422 }
  /api/receiver/inbox/{id}/form6:
    get:
      tags: [접수자 웹]
      summary: 신고서 6개 항목 (RCV-05, R-P02)
      description: |
        시행규칙 제13조 항목. 승인 때 만든 form6 을 쓰고, 없으면(요약 실패) 기록값으로 채운다. 질병명 칸은 "발견 당시 상태: …"로만.
        항목 키는 AI-INT-08 form6 기준이라 소유자 성명과 사육장소가 한 칸이다.
        data = { delivery_id, items[{ key, label, value }], missing[], text(줄바꿈 구분, 빈칸은 '(빈칸)') }. 열람 감사 기록(view, form6)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: 6개 항목 }
        '403': { description: AUTH-403 (관할 밖) }
        '404': { description: NF-404 (없는 전달 · 이력 신고서) }
  /api/receiver/history-reports/{id}/proxy-done:
    patch:
      tags: [접수자 웹]
      summary: 이력 신고 초안 빈칸 채우기 · 대신 신고 마침 (RCV-10, R-S02B)
      description: |
        id 는 history_report_id. fields 는 농가가 비워 둔 칸(missing)과 출생의 calf_tag 만 채울 수 있다 (그 밖의 칸은 VALID-422, 날짜는 YYYY-MM-DD).
        - done=false: 빈칸만 저장. 새로 도착한 기록이면 확인 중으로
        - done=true: 빈칸이 없어야 한다(있으면 VALID-422). 신고서 done, 처리 기록 done(result=proxy_reported), 농가 알림 "축협이 대신 신고했어요",
          일지에 '신고', 폐사·양도 소는 목록에서 빼기, 출생이고 송아지 귀표가 없으면 귀표 30일 할 일(ear_tag_due)
        - 이미 마친 신고서는 CONFLICT-409. 이력제 시스템과 직접 연동하지 않는다 (항목 복사)
        data = { delivery_id, history, status, ear_tag_due }
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fields: { type: object, additionalProperties: { type: string } }
                done: { type: boolean, default: false }
      responses:
        '200': { description: 신고서 상태 }
        '403': { description: AUTH-403 (관할 밖) }
        '404': { description: NF-404 }
        '409': { description: CONFLICT-409 (이미 마침) }
        '422': { description: VALID-422 (빈칸 남음 · 채울 수 없는 칸 · 날짜 형식) }
  /api/receiver/jurisdiction/farms:
    get:
      tags: [접수자 웹]
      summary: 관할 농가 + 지표 (RCV-06, R-S03)
      description: |
        관할 = 우리 기관이 담당 축협인 농가 + 농장 시군구가 관할 지역인 농가. 연락 우선순위(계산식 ⑩): 미응답 → 기한 남은 일수 → 두수 적은 순.
        data = { kpis{ due_soon, unanswered, small_farms, recorded_today }, farms[] }
        - farm = { farm_id, name, address, region_code, head_count, phone_masked, phone_shared, phone, last_record_date, recorded_today,
          next_task{ kind, title, due_date, d_day }, alert_state, reasons[unanswered|due_soon|small] }
        - alert_state: unanswered(48시간 넘게 안 읽음, 제안값) | waiting | seen | null(받은 알림 없음)
        - phone 은 우리 기관에 보낸 가장 최근 기록에서 연락처를 함께 보낸 경우만 (아니면 null)
        - 기한 임박 = 미완료 할 일 기한 7일 이내(지난 것 포함), 소규모 = 50두 미만
      responses:
        '200': { description: 관할 농가 }
  /api/receiver/jurisdiction/farms/{id}/nudge:
    post:
      tags: [접수자 웹]
      summary: 농가 알림 재발송 (RCV-07, R-S03)
      description: 48시간 넘게 안 읽은 가장 최근 알림을 농가 알림함에 한 번 더 넣는다. 감사 기록(nudge, farm). data = { alert_id, created_at }
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer }, description: farm_id }
      responses:
        '201': { description: 다시 알림 }
        '403': { description: AUTH-403 (관할 밖) }
        '404': { description: NF-404 }
        '409': { description: CONFLICT-409 (미응답 알림 없음) }
  /api/receiver/guides:
    get:
      tags: [접수자 웹]
      summary: 게시된 지침 요약 (RCV-08, R-S04)
      description: |
        어드민에서 게시한 요약(biosecurity_rule kind=summary, published)만 문서별로 묶는다.
        data = [{ source_doc, disease, revised_at(가장 최근 개정일), items[{ rule_id, text, clause }] }]
      responses:
        '200': { description: 지침 목록 }
  /api/receiver/stats/weekly:
    get:
      tags: [접수자 웹]
      summary: 주간 통계 (RCV-09, R-S05)
      description: |
        최근 7일(오늘 포함, 한국 시간). data = { from, to, received, done, with_photo, daily[{ date, count }] 7개 }
        - done · with_photo 는 이 기간에 도착한 기록 중 현재 처리 완료 · 사진이 있는 소 상태 기록
      responses:
        '200': { description: 주간 통계 }
components:
  responses:
    Login:
      description: 로그인 성공. 이후 요청에 Authorization 'Bearer {access_token}'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  access_token: { type: string }
                  expires_at: { type: string, format: date-time, description: '농가 30일, 접수자·운영자 8시간' }
                  role: { type: string, enum: [farmer, receiver, admin] }
                  must_change_pw: { type: boolean, description: 'true 면 R-S06 으로' }
              request_id: { type: string }
    RecordDraft:
      description: |
        저장하지 않은 정리 초안 (F-S03 "이렇게 적을까요?"). data = { raw_text, intent(diary|history_report|symptom), items[], report_type, report_fields, missing[], report_notice, fallback }
        - items: [{ category, value, cow_tag4, cow_id(끝 4자리로 찾은 내 소), vaccine_type, head_count }]
        - report_type: 출생 | 폐사 | 양도 | 양수 | 이동 | null. report_fields 는 ReportFields 키 (출생 품종은 어미 소 값으로 채움)
        - report_notice: { report_due, d_day } 신고 기한 안내 (발생일을 알 때)
        - fallback: null | text_input(음성 인식 실패 → F-S02T) | select_input(정리 실패 → F-S03E)
    HistoryReport:
      description: |
        data = { history_report_id, type, fields, missing[], next_question, can_submit, due_date, d_day, mode(self|coop|null),
        status(draft|sent|checking|done), cows[{ field, cow_id, tag_last4, tag_full, breed, sex, birth_date, age_years }],
        farm{ owner_name, farm_name, farm_no, address, org_name } }
        - 빈칸이 없어야 can_submit (직접 제출). 빈칸이 있어도 축협 부탁은 된다
        - 기한 = 발생일 다음 날부터 토·일·공휴일을 빼고 5일째 (mnm-ai rules/deadline 과 같은 규칙)
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AdminOrgRequest:
      type: object
      required: [name, type, region_codes, inboxes]
      properties:
        name: { type: string, maxLength: 100 }
        type: { type: string, enum: [축협, 방역기관, 시군청] }
        region_codes: { type: array, minItems: 1, items: { type: string, pattern: '^\d{10}$' }, description: 관할 법정동 코드 }
        phone: { type: string }
        inboxes:
          type: array
          items:
            type: object
            required: [type, name]
            properties:
              inbox_id: { type: string, description: 없으면 새 수신함 }
              type: { type: string, enum: [history, biosecurity] }
              name: { type: string }
              phone: { type: string }
    AdminGuideContent:
      type: object
      required: [text, source_doc]
      properties:
        disease: { type: string }
        stage: { type: string, enum: [suspect, after_report, regional] }
        text: { type: string, description: 공식 자료 원문 }
        source_doc: { type: string, maxLength: 200 }
        clause: { type: string, maxLength: 200 }
        revised_at: { type: string, format: date }
        display_order: { type: integer }
        example_image: { type: string }
        part_code: { type: string }
        photo_part: { type: string }
        yes_required_parts: { type: array, items: { type: string } }
    ReportFields:
      type: object
      description: |
        이력 신고서 칸. 날짜는 YYYY-MM-DD(미래 불가), 소 칸은 내 소 끝 4자리(양수는 4자리·12자리 그대로)
        - 출생: mother_tag4 · birth_date · sex(암|수) · breed (필수), calf_tag(12자리, 선택)
        - 폐사: cow_tag · death_date
        - 양도 · 양수: cow_tag · move_date · counterpart_farm_no(6자리) (필수), counterpart_name
        - 이동(내 농장 다른 축사): cow_tag · move_date
      additionalProperties: true
    PageResponse:
      type: object
      description: 목록 응답 (BaseResponse 의 data). 다음 요청에 next_cursor 를 그대로 넘긴다
      properties:
        items:
          type: array
          items: {}
        has_next:
          type: boolean
        next_cursor:
          type: string
          nullable: true
          description: 마지막 페이지면 null
    ErrorResponse:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
          description: |
            | 코드 | HTTP | 상황 |
            |---|---|---|
            | AUTH-401 | 401 | 로그인 만료 |
            | AUTH-403 | 403 | 권한 없음 (관할 밖 포함) |
            | AUTH-SUSPENDED | 403 | 정지된 계정 로그인 |
            | AUTH-FAIL | 401 | 로그인 정보 불일치 |
            | AUTH-LOCK | 423 | 5회 실패 → 10분 잠금 |
            | VALID-422 | 422 | 입력 오류 · 잘못된 JSON · 파라미터 오류 |
            | NF-404 | 404 | 없는 기록 · 없는 경로 |
            | METHOD-405 | 405 | 지원하지 않는 메서드 |
            | CONFLICT-409 | 409 | 이미 처리됨 · 중복 요청 |
            | UPLOAD-FAIL | 413 | 업로드 실패 · 용량 초과 (파일 10MB) |
            | CATTLE-NOTFOUND | 404 | 귀표 번호로 소를 못 찾음 |
            | CATTLE-OTHER-FARM | 409 | 다른 농장에 등록된 소 (농가 확인 후 다시 요청) |
            | TRACE-API-FAIL | 502 | 축산물이력제 조회 실패 (직접 입력으로 등록) |
            | DELIVER-FAIL | 500 | 수신함 전달 실패 |
            | SRV-5XX | 500 | 서버 오류 |
          example: VALID-422
        message:
          type: string
          description: 농가 화면에 보여줄 문구 (기능명세서 오류·예외 처리 탭의 "농가 문구"). 접수자 웹·어드민은 code 로 화면 문구를 정한다
          example: 입력한 내용을 다시 확인해 주세요.
        detail:
          type: string
          nullable: true
          description: 개발용 설명. 서버 오류(SRV-5XX)에는 넣지 않는다
        request_id:
          type: string
          description: 요청 추적 번호 (응답 헤더 X-Request-Id 와 같은 값)
        errors:
          type: array
          description: 입력 오류(VALID-422)일 때만. 칸별 문구
          items:
            type: object
            properties:
              field:
                type: string
                example: ear_tag
              message:
                type: string
                example: 귀표 번호 12자리를 모두 넣어 주세요.
